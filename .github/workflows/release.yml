# [INPUT]: 版本标签 v<package.json 的版本>；环境 android-release 里的签名密钥；仓库变量 ANDROID_CERT_SHA256；
#          desktop/（桌面版外壳与打包脚本）。
# [OUTPUT]: GitHub Release：签名的 Android APK，Windows 安装包，macOS dmg（Apple 芯片与 Intel 各一个），Linux AppImage，
#           网页静态包，SHA256SUMS.txt 和发行说明。发完后触发 deploy-site.yml，网站的 /api/version 换成这个版本。每个桌面包发布前都在对应系统上离线跑进第一关。
#           手动运行时只构建和自查，产物合在一个 Artifact 里，不发 Release。
# [POS]: 下载版的发布。网站走 deploy-site.yml，iOS 走 TestFlight，都不在这里。步骤见 docs/RELEASES.md。
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 安卓和网页包：签名密钥只在这一个任务里 ──
  android:
    name: Android APK and web package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # 签名密钥只放在这个环境里，环境只接受 v* 标签和 main。
    environment: android-release
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      # 版本只写在 package.json。标签必须是 v 加上它。
      - name: Read the version
        id: version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version (tag v$version instead)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/out"

      - name: Build the web package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm run build -- --base ./ --outDir "$RUNNER_TEMP/web" --emptyOutDir
          (cd "$RUNNER_TEMP/web" && zip -qr "$RUNNER_TEMP/out/WronglyDrawn-$VERSION-web.zip" .)

      - name: Build the signed Android APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::The android-release environment is missing a signing secret (see docs/RELEASES.md)"
            exit 1
          fi
          umask 077
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/release.p12"
          {
            echo "storeFile=$RUNNER_TEMP/signing/release.p12"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$RUNNER_TEMP/signing/release.properties"
          export WRONGDRAW_SIGNING_PROPERTIES="$RUNNER_TEMP/signing/release.properties"
          WRONGDRAW_GAMEPLAY_COMMIT="$(git rev-parse HEAD)" VITE_RELEASE_ID="android-v$VERSION" ./android/prepare-web.sh
          ./android/gradlew -p android --no-daemon assembleRelease
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/out/WronglyDrawn-$VERSION-android.apk"

      - name: Remove the signing key from the runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"

      # 签名证书必须是一直用的那一张，否则玩家没法覆盖安装。
      - name: Check the APK signature and version
        env:
          VERSION: ${{ steps.version.outputs.version }}
          EXPECTED: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          apk="$RUNNER_TEMP/out/WronglyDrawn-$VERSION-android.apk"
          # 不同版本的 apksigner 给签名者的标法不同（"Signer #1"、"Signer (minSdkVersion=…)"），只认证书那一行。
          "$tools/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/certs.txt"
          grep -E 'certificate (DN|SHA-256 digest)' "$RUNNER_TEMP/certs.txt" | sort -u
          cert="$(sed -n 's/.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/certs.txt" | sort -u | paste -sd' ' -)"
          if [ -z "$EXPECTED" ] || [ "$cert" != "$EXPECTED" ]; then
            echo "::error::The APK is signed with '$cert'; the repository variable ANDROID_CERT_SHA256 says '$EXPECTED'"
            exit 1
          fi
          "$tools/aapt2" dump badging "$apk" | head -1
          "$tools/aapt2" dump badging "$apk" | grep -q "versionName='$VERSION'"

      - name: Hand the files to the publish step
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: part-android
          path: ${{ runner.temp }}/out/
          retention-days: 1

  # ── 桌面版：每个系统在自己的机器上打包，再离线跑进第一关；不碰任何密钥 ──
  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows
            os: windows-2022
            smoke: desktop/release/win-unpacked/WronglyDrawn.exe
            files: desktop/release/*.exe
          - name: macOS
            os: macos-latest
            smoke: desktop/release/mac-arm64/WronglyDrawn.app/Contents/MacOS/WronglyDrawn
            files: desktop/release/*.dmg
          - name: Linux
            os: ubuntu-24.04
            smoke: xvfb-run -a desktop/release/linux-unpacked/WronglyDrawn --no-sandbox
            files: desktop/release/*.AppImage
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install the game and the desktop tools
        run: |
          npm ci
          npm ci --prefix desktop

      - name: Build and pack the desktop app
        run: node desktop/build.mjs

      # 离线：游戏文件全部来自安装包。没有显卡的 CI 机器用软件渲染，玩家的机器不会这样。
      # 检查本身有超时，到时以非零退出；它看到的画面存进 smoke.png。
      - name: Play into the first level
        env:
          WD_SMOKE: '1'
          WD_SHOT: ${{ runner.temp }}/smoke.png
        run: ${{ matrix.smoke }}

      - name: Keep what the check saw
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-${{ matrix.name }}
          path: ${{ runner.temp }}/smoke.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Collect the installers
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp ${{ matrix.files }} "$RUNNER_TEMP/out/"
          ls -l "$RUNNER_TEMP/out"

      - name: Hand the files to the publish step
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: part-desktop-${{ matrix.name }}
          path: ${{ runner.temp }}/out/
          retention-days: 1

  # ── 合在一起：写校验值，打标签时发 Release，手动运行时留一个 Artifact ──
  publish:
    name: Publish the downloads
    needs: [android, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write   # 发完后重新发布网站，让 /api/version 指向新版本
    steps:
      - name: Check out the source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Gather the files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: part-*
          merge-multiple: true
          path: ${{ runner.temp }}/out

      - name: Write the checksums
        run: cd "$RUNNER_TEMP/out" && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Keep the files of a trial run
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: downloads-${{ needs.android.outputs.version }}
          path: ${{ runner.temp }}/out/
          retention-days: 7

      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.android.outputs.version }}
          CERT: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          set -euo pipefail
          sed -e "s/@VERSION@/$VERSION/g" -e "s/@CERT@/$CERT/g" .github/release-notes.md > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/out/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "错画之城 Wrongly Drawn $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes

      # 网站重新发布一次，version.json 换成这个版本，已装的 App 下次启动就会提示更新。
      - name: Tell installed apps about this version
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-site.yml --repo "$GITHUB_REPOSITORY" --ref main
